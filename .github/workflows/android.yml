name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No setup-android step: the ubuntu runner already ships a working SDK
      # (cmdline-tools 20.0). The setup-android action downgrades it to an
      # old sdkmanager whose --licenses fails (run 45055903877).

      - name: Install Android platform 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 2 -name sdkmanager -type f | head -n 1)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses
            "$SDKMANAGER" "platforms;android-36"
          fi

      - name: Build release APK
        run: cd android && chmod +x gradlew && ./gradlew :app:assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tether-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
