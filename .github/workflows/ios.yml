name: iOS IPA (unsigned)

# Builds the iPhone app WITHOUT signing, so it can be sideloaded with
# AltStore (which re-signs it with the user's free Apple ID). The project
# supports this: an empty TETHER_TEAM_ID builds unsigned
# (CODE_SIGNING_ALLOWED=NO), and the default build has no entitlements
# (the Communication Notifications entitlement is only for paid accounts).
#
# NOTE: the build invocation mirrors upstream CI (.github/workflows/ci.yml,
# "iPhone app build (unsigned)"): the app uses swift-perception macros
# (@Perceptible), so xcodebuild needs -skipMacroValidation or the build
# fails with exit code 65. Keep the two in sync.
# 2026-11-23: re-triggered after a macOS runner capacity cancellation
# ("job was not acquired by Runner ... even after multiple attempts").

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  build:
    # macos-15: on 2026-11-23 the macos-latest (arm64) pool repeatedly
    # failed to acquire a runner ("not acquired by Runner ... even after
    # multiple attempts"), and macos-14 is no longer supported
    # ("configuration 'macos-14-arm64-us-default' is not supported").
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set bundle id for the unsigned build
        run: |
          cat > ios/Config/Local.xcconfig <<'EOF'
          TETHER_TEAM_ID =
          TETHER_BUNDLE_ID = com.eblis67.tether
          TETHER_DISPLAY_NAME = Cellular
          EOF

      - name: Generate Xcode project
        run: brew install xcodegen && cd ios && xcodegen generate --quiet

      - name: Build unsigned app
        run: |
          cd ios && xcodebuild -project Tether.xcodeproj -scheme Tether \
            -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build \
            -skipMacroValidation CODE_SIGNING_ALLOWED=NO build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R ios/build/Build/Products/Release-iphoneos/Tether.app Payload/
          zip -r Tether-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: tether-ios-ipa-unsigned
          path: Tether-unsigned.ipa
          if-no-files-found: error
