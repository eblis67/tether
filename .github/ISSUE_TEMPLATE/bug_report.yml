name: Bug report
description: Something does not work as described in the docs.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Privacy:** do not paste phone numbers, contact names, message text, pairing codes,
        keys, tokens or device serial numbers. Replace them with `+1000000000x` or `<redacted>`. The link logs print
        counts, not numbers, but check before you paste.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Part
      multiple: true
      options:
        - Android app (phone with the SIMs)
        - iPhone / iPad app
        - Android client
        - Shell helper / call audio
        - Swift SDK (TetherCore)
        - Kotlin SDK (core)
        - Protocol / docs
        - Build / CI
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tether version or commit
      placeholder: "v1.2.3 or a commit hash"
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android phone and version
      placeholder: "Samsung Galaxy A54, Android 15 (One UI 7)"
  - type: input
    id: apple
    attributes:
      label: iPhone / iPad (or client phone) and version
      placeholder: "iPhone 15, iOS 18.1"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "The Android phone's link log (Tether › Call audio › Link log › Share) and the iPhone's Link › Link log (share button) around the time of the problem. Redact numbers and names."
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed phone numbers, names, message text, keys and tokens from everything above.
          required: true
        - label: I looked at docs/TROUBLESHOOTING.md.
